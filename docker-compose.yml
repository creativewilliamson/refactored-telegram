# VetsEatFree runs as two services:
#   build - one-shot: builds data and every page into ./dist (uses ./data/cache)
#   web   - serves ./dist as plain static files at http://localhost:8095
# Port 8080 belongs to another project. Never use it here.
name: vetseatfree

services:
  build:
    build: .
    image: vetseatfree-app:latest
    command: ["python", "-m", "pipeline.build"]
    volumes:
      - ./:/app
    restart: "no"

  web:
    image: vetseatfree-app:latest
    pull_policy: never
    command: ["python", "-m", "pipeline.serve", "--dir", "dist", "--port", "8095"]
    environment:
      SERVE_QUIET: "1"
    volumes:
      - ./dist:/app/dist:ro
    ports:
      - "127.0.0.1:8095:8095"
    depends_on:
      build:
        condition: service_completed_successfully
    restart: unless-stopped

  # Browser tests (Playwright + axe). Not started by start.ps1.
  # Run: docker compose --profile test run --rm e2e
  e2e:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.e2e
    image: vetseatfree-e2e:latest
    # Share the web container's network so the site is http://localhost:8095,
    # a secure origin (needed for the "Use my location" tests).
    network_mode: "service:web"
    environment:
      BASE_URL: http://localhost:8095
    volumes:
      - ./:/app
    working_dir: /app
    depends_on:
      - web
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider", "tests/e2e"]
